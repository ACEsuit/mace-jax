[metadata]
name = mace_jax
version = attr: mace_jax.__version__
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages = find_namespace:
python_requires = >=3.10
install_requires =
    chex
    optax
    e3nn_jax
    e3nn==0.4.4
    numpy
    ase
    matscipy
    roundmantissa
    jraph
    jax>=0.10.0
    flax
    cuequivariance>=0.10,<0.11
    cuequivariance-jax>=0.10,<0.11
    gin-config
    unique_names_generator
    tqdm
    h5py
    configargparse
    pyyaml

[options.extras_require]
openeq-jax =
    openequivariance[jax]==0.6.8
    openequivariance_extjax==0.6.8
torch-cuda12 =
    torch
    cuequivariance-torch>=0.10,<0.11
    cuequivariance-ops-torch-cu12>=0.10,<0.11
torch-cuda13 =
    torch
    cuequivariance-torch>=0.10,<0.11
    cuequivariance-ops-torch-cu13>=0.10,<0.11
test =
    pytest
    pytest-xdist
    nox
plot =
    matplotlib
    pandas
wandb =
    wandb
data =
    pymatgen
lammps =
    lammps
jax-cuda12 =
    jax[cuda12]>=0.10.0
    cuequivariance-ops-cu12>=0.10,<0.11
    cuequivariance-ops-jax-cu12>=0.10,<0.11
jax-cuda13 =
    jax[cuda13]>=0.10.0
    cuequivariance-ops-cu13>=0.10,<0.11
    cuequivariance-ops-jax-cu13>=0.10,<0.11

[options.entry_points]
console_scripts =
    mace-jax-hdf5-benchmark = mace_jax.cli.mace_jax_hdf5_benchmark:main
    mace-jax-from-torch = mace_jax.cli.mace_jax_from_torch:main
    mace-create-lammps-model = mace_jax.cli.mace_jax_create_lammps_model:main
    mace-jax-hdf5-info = mace_jax.cli.mace_jax_hdf5_info:main
    mace-jax-preprocess = mace_jax.cli.mace_jax_preprocess:main
    mace-jax-predict = mace_jax.cli.mace_jax_predict:main
    mace-jax-train = mace_jax.cli.mace_jax_train:main
    mace-jax-train-plot = mace_jax.cli.mace_jax_train_plot:main
